name: Build Gharb Studi App APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build_apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Project
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> $GITHUB_ENV
          SDKMGR="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
          "$SDKMGR" "platforms;android-34" "build-tools;34.0.0" >/dev/null 2>&1 || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Ensure Permanent Keystore
        run: |
          mkdir -p keystore
          if [ ! -f keystore/gharb-release.p12 ]; then
            keytool -genkeypair -v -keystore keystore/gharb-release.p12 -storetype PKCS12 -keyalg RSA -keysize 2048 -validity 10000 -alias gharb_release_key -storepass "gharb@2026" -keypass "gharb@2026" -dname "CN=Gharb Studi, OU=Mobile, O=GharbStudi, L=Cairo, S=EG, C=EG"
          fi

      - name: Build Signed Release APK
        run: |
          gradle assembleRelease --no-daemon -PGHARB_KEYSTORE_PATH="$PWD/keystore/gharb-release.p12" -PGHARB_KEYSTORE_PASS="gharb@2026" -PGHARB_KEY_ALIAS="gharb_release_key" -PGHARB_KEY_PASS="gharb@2026"
          mkdir -p release_out
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          cp "$APK_PATH" "release_out/gharb_studi_app.apk"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs "release_out/gharb_studi_app.apk" | tee release_out/cert_info.txt

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gharb-studi-release-apk
          path: release_out/gharb_studi_app.apk

      - name: Publish Direct APK Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="gharb-studi-v${{ github.run_number }}"
          CERT_NOTES=$(cat release_out/cert_info.txt | head -n 20)
          gh release create "$TAG" "release_out/gharb_studi_app.apk" --title "gharb studi app ($TAG)" --notes "Signed Release APK for gharb studi app v1.2.0 (v1+v2+v3 Google Play compatible).$'\n\n'$CERT_NOTES"
