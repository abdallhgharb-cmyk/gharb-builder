<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>انشاء لعبة سيارات</title>
  <style>
    *{box-sizing:border-box;user-select:none;}
    body{margin:0;background:#090D16;color:#F8FAFC;font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:8px;}
    .hud,.controls{width:100%;max-width:380px;background:#111827;border:1px solid #1E293B;padding:10px 12px;}
    .hud{border-radius:14px 14px 0 0;display:flex;justify-content:space-between;font-size:13px;font-weight:bold;}
    .hud b{color:#10B981;}
    .wrap{position:relative;width:100%;max-width:380px;background:#1E293B;border-inline:1px solid #334155;}
    canvas{display:block;width:100%;height:390px;}
    .controls{border-radius:0 0 14px 14px;display:flex;flex-direction:column;gap:8px;}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
    .btn{border:none;border-radius:10px;padding:12px 8px;font-weight:bold;font-size:14px;cursor:pointer;color:#fff;}
    .lane{background:#2563EB;}
    .turbo{background:#10B981;color:#052E16;}
    .brake{background:#EF4444;}
    .ov{position:absolute;inset:0;background:rgba(9,13,22,.85);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:16px;}
    .ov.hide{display:none;}
  </style>
</head>
<body>
  <div class="hud"><span>النقاط: <b id="sc">0</b></span><span>السرعة: <b id="sp">120</b> كم/س</span><span>الأعلى: <b id="bs">0</b></span></div>
  <div class="wrap">
    <canvas id="c" width="340" height="390"></canvas>
    <div id="ov" class="ov">
      <h2 id="ot" style="margin:0;color:#10B981;">سباق الخطين السريع</h2>
      <p id="os" style="margin:0;color:#CBD5E1;font-size:13px;">انتقل بين المسارين وتحكم بالسرعة لتفادي السيارات</p>
      <button class="btn turbo" style="padding:12px 24px;" onclick="start()">ابدأ اللعب</button>
    </div>
  </div>
  <div class="controls">
    <div class="row">
      <button class="btn lane" onclick="lane=1">مسار أيمن ➡</button>
      <button class="btn lane" onclick="lane=0">⬅ مسار أيسر</button>
    </div>
    <div class="row">
      <button class="btn turbo" onpointerdown="boost=1" onpointerup="boost=0" onpointerleave="boost=0">⚡ زيادة السرعة</button>
      <button class="btn brake" onpointerdown="slow=1" onpointerup="slow=0" onpointerleave="slow=0">🛑 تهدئة السرعة</button>
    </div>
  </div>
  <script>
    var c=document.getElementById('c'),x=c.getContext('2d'),lanes=[95,245],lane=0,px=95,boost=0,slow=0,run=0,sc=0,dash=0,obs=[],t=0,best=+localStorage.getItem('car2_best')||0;
    document.getElementById('bs').textContent=best;
    document.addEventListener('keydown',function(e){if(e.key==='ArrowRight')lane=1;if(e.key==='ArrowLeft')lane=0;if(e.key==='ArrowUp')boost=1;if(e.key==='ArrowDown')slow=1;});
    document.addEventListener('keyup',function(e){if(e.key==='ArrowUp')boost=0;if(e.key==='ArrowDown')slow=0;});
    function start(){run=1;sc=0;obs=[];lane=0;px=lanes[0];document.getElementById('ov').classList.add('hide');loop();}
    function car(cx,cy,col){x.fillStyle=col;x.fillRect(cx-20,cy,40,68);x.fillStyle='#0F172A';x.fillRect(cx-14,cy+12,28,16);}
    function loop(){
      if(!run)return;
      var spd=Math.max(2,4.2+sc*0.02+(boost?4:0)-(slow?2:0));
      document.getElementById('sp').textContent=Math.round(spd*25);
      x.fillStyle='#1E293B';x.fillRect(0,0,c.width,c.height);
      x.fillStyle='#10B981';x.fillRect(8,0,5,c.height);x.fillRect(c.width-13,0,5,c.height);
      dash=(dash+spd)%44;x.fillStyle='#F8FAFC';for(var y=dash-44;y<c.height;y+=44)x.fillRect(c.width/2-3,y,6,22);
      px+=(lanes[lane]-px)*0.25;car(px,305,'#10B981');
      t+=spd;if(t>160){t=0;var l=Math.random()<.5?0:1;obs.push({x:lanes[l],y:-75,col:l?'#38BDF8':'#F59E0B'});}
      for(var i=obs.length-1;i>=0;i--){
        var o=obs[i];o.y+=spd*0.9;car(o.x,o.y,o.col);
        if(Math.abs(o.x-px)<32&&o.y+66>310&&o.y<368){run=0;if(sc>best){best=sc;localStorage.setItem('car2_best',best);document.getElementById('bs').textContent=best;}document.getElementById('ot').textContent='انتهى السباق!';document.getElementById('os').textContent='النقاط: '+sc;document.getElementById('ov').classList.remove('hide');return;}
        if(o.y>c.height){obs.splice(i,1);sc+=(boost?2:1);document.getElementById('sc').textContent=sc;}
      }
      requestAnimationFrame(loop);
    }
  </script>
</body>
</html>
