    <style>
        /* إعدادات الخطوط والحركات الكرتونية المخصصة */
        body {
            font-family: 'Cairo', sans-serif;
            overflow-x: hidden;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .cartoon-title {
            font-family: 'Lalezar', 'Cairo', cursive;
            text-shadow: 0 4px 0 #be123c, 0 8px 15px rgba(225, 29, 72, 0.3);
        }
        /* حركة النبض للعنوان */
        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            15% { transform: scale(1.06); }
            30% { transform: scale(1); }
            45% { transform: scale(1.08); }
            60% { transform: scale(1); }
        }
        .animate-heartbeat {
            animation: heartbeat 2.2s infinite ease-in-out;
        }
        /* حركة القفز الكرتونية للشخصيات */
        @keyframes cartoonBounce {
            0%, 100% { transform: translateY(0) scaleY(1) scaleX(1); }
            30% { transform: translateY(-18px) scaleY(1.08) scaleX(0.94); }
            55% { transform: translateY(0) scaleY(0.9) scaleX(1.1); }
            75% { transform: translateY(-6px) scaleY(1.02) scaleX(0.98); }
        }
        .character-bounce {
            animation: cartoonBounce 0.65s infinite ease-in-out;
            transform-origin: bottom center;
        }
        /* حركة الدوران المضحكة عند الفوز أو المفاجأة */
        @keyframes dizzySpin {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(180deg) scale(1.2); }
            100% { transform: rotate(360deg) scale(1); }
        }
        .character-spin {
            animation: dizzySpin 0.6s ease-out;
        }
        /* حركة غبار الركض الكرتوني */
        @keyframes dustPuff {
            0% { opacity: 0.9; transform: scale(0.4) translate(0, 0); }
            100% { opacity: 0; transform: scale(1.6) translate(25px, -15px); }
        }
        .dust-cloud {
            position: absolute;
            background: rgba(255, 255, 255, 0.85);
            border-radius: 50%;
            pointer-events: none;
            animation: dustPuff 0.6s forwards ease-out;
        }
        /* حركة القلوب المتطايرة */
        @keyframes floatHeart {
            0% { transform: translateY(0) scale(0.5) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-140px) scale(1.4) rotate(25deg); opacity: 0; }
        }
        .floating-heart {
            position: absolute;
            pointer-events: none;
            animation: floatHeart 1.4s forwards ease-out;
            z-index: 30;
        }
        /* حركة السحب في الخلفية */
        @keyframes moveClouds {
            0% { transform: translateX(-120px); }
            100% { transform: translateX(100vw); }
        }
        .cloud-drift {
            animation: moveClouds 28s linear infinite;
        }
    </style>

    <script>
        // ==========================================
        // إعدادات الصوت الكرتوني (Web Audio API) بدون روابط خارجية
        // ==========================================
        let soundEnabled = true;
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }
        // توليد أصوات كرتونية مضحكة (قفز، انزلاق، قلوب)
        function playCartoonSound(type) {
            if (!soundEnabled) return;
            try {
                initAudio();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                const now = audioCtx.currentTime;
                if (type === 'boing') {
                    // صوت قفزة كرتونية
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(180, now);
                    osc.frequency.exponentialRampToValueAtTime(520, now + 0.18);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                    osc.start(now);
                    osc.stop(now + 0.2);
                } else if (type === 'slip') {
                    // صوت انزلاق مضحك مثل توم وجيري
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(600, now);
                    osc.frequency.exponentialRampToValueAtTime(120, now + 0.35);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.36);
                    osc.start(now);
                    osc.stop(now + 0.36);
                } else if (type === 'love') {
                    // نغمة رومانسية مبهجة
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(440, now);
                    osc.frequency.setValueAtTime(554.37, now + 0.1);
                    osc.frequency.setValueAtTime(659.25, now + 0.2);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.45);
                    osc.start(now);
                    osc.stop(now + 0.45);
                }
            } catch (e) {
                // تجاهل أخطاء الصوت في حال عدم التفاعل المسبق
            }
        }
        // ==========================================
        // متغيرات وعناصر المشهد الكرتوني
        // ==========================================
        const stage = document.getElementById('stage');
        const ahlamEl = document.getElementById('ahlam-char');
        const mahdiEl = document.getElementById('mahdi-char');
        const ahlamSprite = document.getElementById('ahlam-sprite');
        const mahdiSprite = document.getElementById('mahdi-sprite');
        const bubbleText = document.getElementById('bubble-text');
        const chaseCountEl = document.getElementById('chase-count');
        const catchOverlay = document.getElementById('catch-overlay');
        // مواقع الشخصيات كنسبة مئوية من عرض المسرح (0% إلى 85%)
        let ahlamX = 18;
        let mahdiX = 68;
        let direction = -1; // -1 يعني الركض لليسار، 1 يعني الركض لليمين
        let mahdiSpeed = 0.42;
        let ahlamSpeed = 0.40;
        let isPaused = false;
        let chaseNumber = 1;
        let frameCounter = 0;
        // عبارات كوميدية متبادلة بين أحلام ومهدي
        const funnyDialogues = [
            "مهدي: انتظري يا أحلام، قلبي تعب من الركض! 🏃‍♂️❤️",
            "أحلام: لن تمسك بي يا مهدي، أنا أسرع منك! 😜👑",
            "مهدي: معي أجمل وردة لأجمل أحلام في الدنيا! 🌹",
            "أحلام: هاهاها! حاول مرة أخرى يا بطل! 😂💨",
            "مهدي: أنا أحبك يا أحلام.. توقفي قليلاً! 😍💘",
            "أحلام: المطاردة ممتعة مثل توم وجيري! 🐭🐱"
        ];
        let dialogueIndex = 0;
        // تحديث الحوار التلقائي كل بضع ثوانٍ
        setInterval(() => {
            if (!isPaused) {
                dialogueIndex = (dialogueIndex + 1) % funnyDialogues.length;
                bubbleText.textContent = funnyDialogues[dialogueIndex];
            }
        }, 3200);
        // إنشاء غبار الركض الكرتوني خلف الشخصيات
        function spawnDust(xPercent) {
            const dust = document.createElement('div');
            dust.className = 'dust-cloud';
            const size = Math.random() * 14 + 10;
            dust.style.width = `${size}px`;
            dust.style.height = `${size}px`;
            dust.style.left = `calc(${xPercent}% + 30px)`;
            dust.style.bottom = '52px';
            stage.appendChild(dust);
            setTimeout(() => dust.remove(), 600);
        }
        // إطلاق قلب طائر في مكان محدد
        function spawnHeart(xPercent, yBottom = 110) {
            const heart = document.createElement('div');
            heart.className = 'floating-heart text-2xl sm:text-3xl';
            const emojis = ['❤️', '💖', '💘', '💕', '🌹', '😍'];
            heart.textContent = emojis[Math.floor(Math.random() * emojis.length)];
            heart.style.left = `calc(${xPercent}% + ${(Math.random() * 40 - 20)}px)`;
            heart.style.bottom = `${yBottom}px`;
            stage.appendChild(heart);
            setTimeout(() => heart.remove(), 1400);
        }
        // ==========================================
        // حلقة الرسوم المتحركة الرئيسية (Game/Animation Loop)
        // ==========================================
        function animateChase() {
            if (!isPaused) {
                frameCounter++;
                // تحريك الشخصيات
                ahlamX += ahlamSpeed * direction;
                mahdiX += mahdiSpeed * direction;
                // عكس الاتجاه عند الوصول لحواف المسرح (مثل أفلام الكرتون)
                if (direction === -1 && ahlamX <= 4) {
                    direction = 1;
                    // مهدي يتجاوز قليلاً ثم يلتف بسرعة!
                    mahdiX = Math.min(82, mahdiX + 6);
                    playCartoonSound('boing');
                } else if (direction === 1 && ahlamX >= 78) {
                    direction = -1;
                    mahdiX = Math.max(4, mahdiX - 6);
                    playCartoonSound('boing');
                }
                // قلب اتجاه النظر للشخصيات حسب اتجاه الركض
                ahlamSprite.style.transform = direction === 1 ? 'scaleX(-1)' : 'scaleX(1)';
                mahdiSprite.style.transform = direction === 1 ? 'scaleX(-1)' : 'scaleX(1)';
                // تطبيق المواقع على العناصر
                ahlamEl.style.left = `${ahlamX}%`;
                mahdiEl.style.left = `${mahdiX}%`;
                // إضافة غبار الركض وقلوب صغيرة كل عدة إطارات
                if (frameCounter % 18 === 0) {
                    spawnDust(mahdiX);
                    spawnDust(ahlamX);
                }
                if (frameCounter % 45 === 0) {
                    spawnHeart(mahdiX, 120);
                }
                // التحقق هل أمسك مهدي بأحلام؟
                if (Math.abs(mahdiX - ahlamX) < 7) {
                    triggerCatchCelebration();
                }
            }
            requestAnimationFrame(animateChase);
        }
        // احتفالية لطيفة عندما يلحق مهدي بأحلام
        function triggerCatchCelebration() {
            isPaused = true;
            playCartoonSound('love');
            catchOverlay.classList.remove('hidden');
            bubbleText.textContent = "أمسكت بكِ يا أحلام! أنا أحبكِ كثيراً ❤️🎉";
            // إطلاق وابل من القلوب
            for (let i = 0; i < 16; i++) {
                setTimeout(() => {
                    spawnHeart(ahlamX + (Math.random() * 14 - 7), 90 + Math.random() * 50);
                }, i * 80);
            }
            // إعادة بدء المطاردة بشكل مضحك بعد 2.8 ثانية
            setTimeout(() => {
                catchOverlay.classList.add('hidden');
                chaseNumber++;
                chaseCountEl.textContent = chaseNumber;
                mahdiSpeed = 0.42;
                ahlamSpeed = 0.40;
                // أحلام تهرب مجدداً بضحكة!
                ahlamX = direction === -1 ? 15 : 70;
                mahdiX = direction === -1 ? 72 : 12;
                bubbleText.textContent = "أحلام: هربت من جديد! يلا الحاق بي يا مهدي 😂🏃‍♀️";
                isPaused = false;
            }, 2800);
        }
        // ==========================================
        // تفاعلات الأزرار
        // ==========================================
        // 1. زر تسريع مهدي
        document.getElementById('btn-boost').addEventListener('click', () => {
            if (isPaused) return;
            playCartoonSound('boing');
            mahdiSpeed = 0.95;
            bubbleText.textContent = "مهدي: تشغيل السرعة القصوى للحاق بأحلام! 🚀❤️";
            spawnHeart(mahdiX, 110);
            setTimeout(() => {
                mahdiSpeed = 0.44;
            }, 1800);
        });
        // 2. زر مقلب توم وجيري (قشرة موز كوميدية!)
        document.getElementById('btn-trick').addEventListener('click', () => {
            if (isPaused) return;
            playCartoonSound('slip');
            
            // إضافة قشرة موز مؤقتة في المسرح
            const banana = document.createElement('div');
            banana.textContent = '🍌';
            banana.className = 'absolute bottom-14 text-3xl z-20 transition-all duration-300';
            banana.style.left = `${mahdiX}%`;
            stage.appendChild(banana);
            // حركة دوران مضحكة لمهدي
            mahdiSprite.classList.add('character-spin');
            bubbleText.textContent = "مهدي: أوووبس! قشرة موز من مقالب أحلام! 🍌💫😂";
            
            // تراجع مهدي قليلاً للخلف بشكل كرتوني
            mahdiX = Math.max(5, Math.min(80, mahdiX - (direction * 14)));
            setTimeout(() => {
                mahdiSprite.classList.remove('character-spin');
                banana.remove();
            }, 700);
        });
        // 3. زر مطر القلوب
        document.getElementById('btn-hearts').addEventListener('click', () => {
            playCartoonSound('love');
            bubbleText.textContent = "أنا أحبك يا أحلام.. كل السماء تمطر حباً! 💖🌧️";
            for (let i = 0; i < 20; i++) {
                setTimeout(() => {
                    spawnHeart(Math.random() * 85 + 5, Math.random() * 80 + 60);
                }, i * 60);
            }
        });
        // 4. زر كتم/تشغيل الصوت
        const btnSound = document.getElementById('btn-sound');
        const soundIcon = document.getElementById('sound-icon');
        btnSound.addEventListener('click', () => {
            soundEnabled = !soundEnabled;
            soundIcon.textContent = soundEnabled ? '🔊' : '🔇';
            if (soundEnabled) playCartoonSound('boing');
        });
        // النقر مباشرة على الشخصيات يطلق قلوباً وضحكات
        ahlamEl.addEventListener('click', () => {
            playCartoonSound('boing');
            spawnHeart(ahlamX, 120);
            bubbleText.textContent = "أحلام: هيهيهي! لن تمسك بي يا مهدي! 👑✨";
        });
        mahdiEl.addEventListener('click', () => {
            playCartoonSound('love');
            spawnHeart(mahdiX, 120);
            bubbleText.textContent = "مهدي: أحبك يا أحلام للأبد! ❤️🌹";
        });
        // تزيين الخلفية بقلوب ثابتة لطيفة
        const bgDecor = document.getElementById('bg-decorations');
        for (let i = 0; i < 14; i++) {
            const el = document.createElement('div');
            el.textContent = i % 2 === 0 ? '❤️' : '💖';
            el.className = 'absolute text-2xl sm:text-3xl';
            el.style.top = `${Math.random() * 90}%`;
            el.style.left = `${Math.random() * 90}%`;
            el.style.transform = `rotate(${Math.random() * 40 - 20}deg)`;
            bgDecor.appendChild(el);
        }
        // بدء التشغيل عند اكتمال تحميل الصفحة
        window.onload = function() {
            animateChase();
        };
    </script>
