<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>gharb studi app</title>
  <style>
    body {
      margin: 0;
      background: #090D16;
      color: #F8FAFC;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      box-sizing: border-box;
      text-align: center;
    }
    .card {
      background: #111827;
      border: 1px solid #334155;
      border-radius: 24px;
      padding: 32px 24px;
      max-width: 360px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }
    .logo {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      margin: 0 auto 16px;
      border: 2px solid #10B981;
      display: block;
      object-fit: cover;
    }
    h1 {
      color: #10B981;
      font-size: 22px;
      margin: 0 0 8px;
    }
    p {
      color: #94A3B8;
      font-size: 13px;
      line-height: 1.6;
      margin: 0 0 20px;
    }
    .badge {
      display: inline-block;
      background: rgba(16, 185, 129, 0.15);
      color: #34D399;
      padding: 6px 14px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: bold;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="app_icon.png" class="logo" alt="gharb studio app" />
    <h1>gharb studi app</h1>
    <p>منصة الغارب لصناعة وتحويل التطبيقات من الصفر (ZIP • HTML • URL) إلى APK حقيقي.</p>
    <div class="badge">يعمل بنجاح داخل أندرويد WebView</div>
  </div>
</body>
</html>
